<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Campus Virtual — Universidad del Aluminio</title>
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #091a2c 0%, #0f2b48 50%, #1e3a8a 100%);
            margin: 0;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -10%;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(2, 132, 199, 0.15) 0%, rgba(2, 132, 199, 0) 70%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, rgba(14, 165, 233, 0) 70%);
            pointer-events: none;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: var(--radius-xl);
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
        }

        .brand-icon-wrapper {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.25rem;
            box-shadow: 0 10px 20px -5px rgba(15, 43, 72, 0.3);
        }

        .input-group-text {
            background-color: #f8fafc;
            border-color: #e2e8f0;
            color: #64748b;
        }

        .form-control:focus + .input-group-text,
        .input-group-text:focus-within {
            border-color: var(--accent-color);
        }

        .btn-toggle-pwd {
            border-left: none;
            background-color: #f8fafc;
            color: #64748b;
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .btn-toggle-pwd:hover {
            color: var(--primary-color);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <!-- Logo Institucional -->
        <div class="text-center mb-4">
            <div class="brand-icon-wrapper">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h3 class="fw-bold text-primary mb-1">Universidad del Aluminio</h3>
            <p class="text-muted small mb-0">Campus Virtual de Formación Técnica</p>
        </div>

        <!-- Formulario de Acceso -->
        <form id="login-form">
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Cédula o Identificación</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-vcard-fill"></i></span>
                    <input type="text" id="login-id" class="form-control" required placeholder="Ej: 25482938" autocomplete="username">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" id="login-pass" class="form-control border-end-0" required placeholder="••••••••" autocomplete="current-password">
                    <button class="btn btn-outline-secondary btn-toggle-pwd" type="button" id="btn-toggle-password" onclick="togglePasswordVisibility()" title="Mostrar u ocultar contraseña">
                        <i class="bi bi-eye" id="pwd-icon"></i>
                    </button>
                </div>
            </div>

            <div id="login-error" class="alert alert-danger py-2 px-3 small text-center mb-3" style="display:none;">
                <i class="bi bi-exclamation-circle-fill me-1"></i> Cédula o contraseña incorrecta.
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
            </button>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="small text-muted mb-2">¿No tienes credenciales de acceso?</p>
                <button type="button" class="btn btn-outline-primary btn-sm px-3" data-bs-toggle="modal" data-bs-target="#registroModal">
                    <i class="bi bi-person-plus me-1"></i> Solicitar Cuenta de Acceso
                </button>
            </div>
        </form>
    </div>

    <!-- Modal de Solicitud de Registro -->
    <div class="modal fade" id="registroModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <form onsubmit="event.preventDefault(); window.solicitarRegistro(
                    document.getElementById('reg-id').value,
                    document.getElementById('reg-nombre').value,
                    document.getElementById('reg-pass').value,
                    document.getElementById('reg-cargo').value
                )">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title"><i class="bi bi-person-badge me-2"></i>Solicitud de Cuenta</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4">
                        <p class="text-muted small mb-3">Tu solicitud será evaluada y autorizada por la administración académica.</p>
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Cédula de Identidad</label>
                            <input type="text" id="reg-id" class="form-control" placeholder="Ej: 25482938" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nombre y Apellido</label>
                            <input type="text" id="reg-nombre" class="form-control" placeholder="Ej: Juan Pérez" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Contraseña Deseada</label>
                            <input type="password" id="reg-pass" class="form-control" placeholder="Mínimo 4 caracteres" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Cargo o Perfil que Desempeña:</label>
                            <select id="reg-cargo" class="form-select">
                                <option value="asesor_ventas">Asesor de Ventas</option>
                                <option value="proyectista">Proyectista / Diseño</option>
                                <option value="participante">Participante General</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary px-4">Enviar Solicitud</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts Esenciales -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ui/modal.js"></script>
    <script src="js/api.js"></script>
    <script src="script.js"></script>
    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('login-pass');
            const icon = document.getElementById('pwd-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                pwdInput.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id   = document.getElementById('login-id').value.trim();
            const pass = document.getElementById('login-pass').value;
            const btn  = e.submitter || document.querySelector('#login-form button[type=submit]');
            const errEl = document.getElementById('login-error');

            errEl.style.display = 'none';
            btn.disabled = true;
            const origHtml = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verificando acceso...';

            const ok = await window.login(id, pass);

            btn.disabled = false;
            btn.innerHTML = origHtml;

            if (ok) {
                window.location.href = 'index.html';
            } else {
                errEl.style.display = 'block';
            }
        });
    </script>
</body>

</html>
